[project]
name = "citadel"
dynamic = ["version"]
description = "A reference library for scientists, in the terminal: ingest, catalogue, cite, and serve papers to agents."
requires-python = ">=3.12"
dependencies = [
    "textual>=8.0",
    "textual-image[textual]>=0.14",
    "httpx>=0.28",
    "pillow>=11",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
citadel = "citadel.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "citadel.__version__"}

[tool.setuptools.package-data]
citadel = ["*.tcss", "*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
