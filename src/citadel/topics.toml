# Citadel topic tree. Each table is one folder in the library.
#
# - Keys are folder paths: discipline/field/subfield, at most three levels,
#   lowercase kebab-case. Every parent must be listed too.
# - `description` and `keywords` tell the classifier what belongs here.
# - To add a topic, add a table and run `citadel init` (it only creates folders).
#   Renaming or removing a topic that already holds references needs `citadel move`.

# --- Plasma physics -----------------------------------------------------------

["plasma-physics"]
description = "Plasma physics: broad reviews, textbooks and anything spanning several plasma fields."
keywords = ["plasma", "plasma physics", "plasmas"]

["plasma-physics/fundamentals"]
description = "Basic plasma theory: kinetic theory, transport coefficients, collisions, waves, formularies."
keywords = ["kinetic theory", "transport coefficients", "Braginskii", "Coulomb collisions", "Vlasov", "formulary", "Debye length", "plasma waves", "dielectric tensor"]

["plasma-physics/mhd"]
description = "Magnetohydrodynamics: equilibria, reconnection, MHD waves and stability theory."
keywords = ["magnetohydrodynamics", "MHD", "equilibrium", "magnetic reconnection", "Alfven", "Grad-Shafranov"]

["plasma-physics/turbulence-transport"]
description = "Plasma and MHD turbulence, energy spectra, intermittency, anomalous transport and Lévy walks."
keywords = ["turbulence", "MHD turbulence", "compressible turbulence", "energy spectrum", "turbulent cascade", "intermittency", "anomalous transport", "Levy walk", "Levy flight", "edge turbulence", "dynamo"]

["plasma-physics/instabilities"]
description = "Plasma instabilities: Kelvin-Helmholtz, Rayleigh-Taylor, magneto-Rayleigh-Taylor, kink and sausage modes."
keywords = ["instability", "instabilities", "Kelvin-Helmholtz", "Rayleigh-Taylor", "Richtmyer-Meshkov", "magneto-Rayleigh-Taylor", "kink", "sausage", "growth rate", "hydrodynamic instability"]

["plasma-physics/hedp"]
description = "High energy density physics: matter at extreme pressure and temperature."
keywords = ["high energy density", "HEDP", "HED", "warm dense matter"]

["plasma-physics/hedp/pulsed-power"]
description = "Pulsed-power driven plasmas: z-pinches, wire arrays, MAGPIE, Z machine."
keywords = ["pulsed power", "z-pinch", "wire array", "MAGPIE", "Z machine", "MagLIF", "COBRA", "rotating plasma", "plasma jet", "gas puff"]

["plasma-physics/hedp/laser-plasma"]
description = "Laser-plasma interaction and laser-driven HED experiments."
keywords = ["laser-plasma", "laser-driven", "OMEGA", "high-power laser", "laser ablation", "X-ray free-electron laser", "XFEL", "femtosecond", "solid density", "warm dense matter", "relativistic laser"]

["plasma-physics/hedp/icf"]
description = "Inertial confinement fusion: implosions, capsules, hohlraums, ignition."
keywords = ["inertial confinement fusion", "ICF", "implosion", "hohlraum", "capsule", "ignition"]

["plasma-physics/hedp/laboratory-astrophysics"]
description = "Laboratory astrophysics: scaled experiments of jets, shocks, colliding flows and astrophysical plasmas."
keywords = ["laboratory astrophysics", "astrophysical jets", "astrophysical", "colliding flows", "supernova", "accretion", "radiative shocks", "young stellar", "Ryutov scaling", "experimental astrophysics"]

["plasma-physics/diagnostics"]
description = "Plasma diagnostics in general: reviews, courses and multi-technique papers."
keywords = ["plasma diagnostics", "diagnostic technique", "diagnostic techniques"]

["plasma-physics/diagnostics/refractive"]
description = "Refractive diagnostics: schlieren, shadowgraphy, interferometry, deflectometry, Faraday rotation."
keywords = ["schlieren", "shadowgraphy", "shadowgraph", "interferometry", "interferometer", "deflectometry", "Faraday rotation", "refractive index gradient", "density gradient", "polarimetry"]

["plasma-physics/diagnostics/scattering"]
description = "Scattering diagnostics: Thomson scattering, collective scattering, laser scattering."
keywords = ["Thomson scattering", "collective scattering", "laser scattering", "scattering spectrum"]

["plasma-physics/diagnostics/spectroscopy"]
description = "Plasma spectroscopy: emission, absorption, line broadening, X-ray spectroscopy."
keywords = ["spectroscopy", "emission lines", "Stark broadening", "X-ray spectroscopy", "line ratio", "laser-induced fluorescence", "LIF", "velocity distribution function", "optical emission"]

["plasma-physics/diagnostics/imaging"]
description = "Imaging diagnostics: fast cameras, X-ray imaging, tomography, digital image correlation."
keywords = ["high-speed camera", "high-speed imaging", "X-ray imaging", "radiography", "tomography", "digital image correlation", "framing camera", "streak camera", "proton radiography"]

["plasma-physics/diagnostics/particle-probes"]
description = "Probe and particle diagnostics: Langmuir and magnetic probes, neutron and particle detectors."
keywords = ["Langmuir probe", "magnetic probe", "B-dot", "neutron", "particle detector", "Rogowski"]

["plasma-physics/diagnostics/synthetic"]
description = "Synthetic diagnostics and forward models of measurements."
keywords = ["synthetic diagnostic", "forward model", "ray tracing", "simulated measurement"]

["plasma-physics/computational"]
description = "Computational plasma physics: PIC, MHD and kinetic codes, numerical methods for plasmas."
keywords = ["particle-in-cell", "PIC simulation", "MHD simulation", "MHD code", "kinetic simulation", "Gorgon", "hybrid code", "numerical scheme"]

["plasma-physics/fusion"]
description = "Fusion energy: reviews, roadmaps and reactor-level studies."
keywords = ["fusion energy", "nuclear fusion", "fusion reactor", "fusion power", "power plant", "controlled fusion"]

["plasma-physics/fusion/magnetic-confinement"]
description = "Magnetic confinement fusion: tokamaks and stellarators."
keywords = ["tokamak", "stellarator", "magnetic confinement", "ITER", "divertor", "H-mode"]

["plasma-physics/fusion/alternative-concepts"]
description = "Alternative fusion concepts: FRC, PFRC, z-pinch fusion, magneto-inertial fusion."
keywords = ["field-reversed configuration", "FRC", "PFRC", "magneto-inertial", "MIF", "sheared-flow z-pinch", "alternative concept"]

["plasma-physics/accelerators"]
description = "Plasma-based accelerators: plasma wakefield and laser-driven acceleration."
keywords = ["plasma wakefield", "wakefield acceleration", "laser wakefield", "LWFA", "PWFA", "accelerator"]

